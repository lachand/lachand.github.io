title:       Valentin Lachand-Pascal
description: Docteur en informatique, professeur agrégé à l'ICOM (Université Lumière Lyon 2). Recherche sur l'orchestration d'activités d'apprentissage numériques.
url:         https://valentin.lachand.net
baseurl:     ''
permalink:   pretty
lang:        fr

author:
  name:  Valentin Lachand-Pascal
  email: valentin.lachand-pascal@univ-lyon2.fr

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

markdown:    kramdown
highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - LICENSE.md
  - node_modules

defaults:
  - scope:
      path: ""
    values:
      lang: fr
  - scope:
      path: "en"
    values:
      lang: en
  - scope:
      path: "teaching"
    values:
      section: teaching
      layout: default
  - scope:
      path: "presentations"
    values:
      section: talks
      layout: default

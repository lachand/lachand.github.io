  research: Recherche
  research_lead: "Les activités d'apprentissage dépassent les frontières des disciplines et se déroulent en classe, à la maison, en bibliothèque. Elles passent de plus en plus par le numérique, mais la plupart des outils restent centrés sur l'application, rangent les documents en silos et sont pensés pour un appareil et un contexte donnés. Ma recherche propose une approche centrée sur l'activité pour faciliter l'orchestration des activités d'apprentissage, dans la classe et au dehors."

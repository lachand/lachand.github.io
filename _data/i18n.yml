  research: Research
  research_lead: "Learning activities increasingly cross disciplinary boundaries and unfold in many places: the classroom, the home, libraries. They are also increasingly digitally mediated. However, most tools are application-centric, structure documents and resources in silos, and are designed for a given device and context of use. My research proposes an activity-centric approach to ease the orchestration of learning activities, inside and outside the classroom."
